name: DevOps Scripts CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate script permissions
        run: |
          chmod +x *.sh

      - name: Run cluster audit script
        run: |
          ./inspect_cluster.sh staging
